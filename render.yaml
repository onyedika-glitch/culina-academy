services:
  - type: web
    name: culinaacademy
    env: docker
    plan: free
    dockerfilePath: ./culina-academy-laravel/Dockerfile
    dockerContext: ./culina-academy-laravel
    healthCheckPath: /api/health
    
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://culinaacademy.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: LOG_CHANNEL
        value: json
      - key: LOG_LEVEL
        value: error
      - key: QUEUE_CONNECTION
        value: sync
      
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      


      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: "admin@example.com"
      - key: MAIL_FROM_NAME
        value: "${APP_NAME}"